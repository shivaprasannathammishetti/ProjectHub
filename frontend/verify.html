<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Email — ProjectHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .verify-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h2 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #6366f1;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: background 0.2s;
    }
    .btn:hover { background: #4f46e5; }
    .loading { color: #6366f1; font-size: 14px; }
    .success { color: #34d399; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="verify-box">
    <div class="icon" id="icon">⏳</div>
    <h2 id="title">Verifying your email...</h2>
    <p id="message" class="loading">Please wait while we verify your account.</p>
    <div id="btn-area"></div>
  </div>

  <script>
    const API = 'http://127.0.0.1:5000/api';

    window.onload = async () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        showError('Invalid verification link.');
        return;
      }

      try {
        const res = await fetch(`${API}/auth/verify/${token}`);
        const data = await res.json();

        if (res.ok) {
          document.getElementById('icon').textContent = '✅';
          document.getElementById('title').textContent = 'Email Verified!';
          document.getElementById('message').innerHTML =
            `<span class="success">${data.message}</span>`;
          document.getElementById('btn-area').innerHTML =
            `<a href="index.html" class="btn"><i class="fas fa-sign-in-alt"></i> Go to Login</a>`;
        } else {
          showError(data.message);
        }
      } catch (err) {
        showError('Server error. Please try again.');
      }
    };

    function showError(msg) {
      document.getElementById('icon').textContent = '❌';
      document.getElementById('title').textContent = 'Verification Failed';
      document.getElementById('message').innerHTML = `<span class="error">${msg}</span>`;
      document.getElementById('btn-area').innerHTML =
        `<a href="index.html" class="btn">Back to Login</a>`;
    }
  </script>
</body>
</html>
